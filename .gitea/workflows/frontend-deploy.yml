name: Deploy Frontend to Cloudflare Pages

on:
        push:
                branches:
                        - main

jobs:
        frontend-deploy:
                runs-on: ubuntu-latest # Ensure your Gitea runner supports Docker or ubuntu-latest tags
                steps:
                        - name: Checkout repository
                          uses: actions/checkout@v4
                          with:
                                  fetch-depth: 0

                        - name: Setup Node.js
                          uses: actions/setup-node@v4
                          with:
                                  node-version: 20
                                  cache: 'npm' # Speeds up subsequent runs if package-lock.json exists

                        - name: Deploy to Cloudflare Pages
                          run: npx wrangler deploy --assets=./app/src/frontend --name website --no-bundle --compatibility-date "$(date -u +%Y-%m-%d)"
                          env:
                                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                                  CLOUDFLARE_CI: true
