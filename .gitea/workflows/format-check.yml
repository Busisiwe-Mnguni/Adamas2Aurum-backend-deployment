name: Format Check

on:
    push:
    pull_request:
        branches: ["main"]

jobs:
    format-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: Check Formatting
              run: npx prettier --check .
