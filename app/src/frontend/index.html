<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Adamas2Auruma - Interactive Campus Exploration</title>

		<!-- Leaflet CSS & JS -->
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<link rel="stylesheet" href="/css/style.css" />
		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>

		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family:
					-apple-system, BlinkMacSystemFont,
					'Segoe UI', Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
			}

			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				overflow: hidden;
			}

			#map {
				flex: 1;
				width: 100%;
				height: calc(100vh - 60px);
			}
			
			.offline-banner {
				display: none;
				background: #78350f;
				color: #fef3c7;
				font-size: 0.85rem;
				padding: 0.5rem 1rem;
				text-align: center;
				border-bottom: 1px solid #92400e;
				font-weight: 500;
			}
			.offline-banner.visible {
				display: block;
			}

			/* ---- Auth side drawer ---- */
			.auth-overlay {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background: rgba(0, 0, 0, 0.4);
				z-index: 2000;
			}
			.auth-overlay.open {
				display: block;
			}

			.auth-drawer {
				position: fixed;
				top: 0;
				right: -420px;
				width: 400px;
				max-width: 90vw;
				height: 100vh;
				background: #1e293b;
				color: #f8fafc;
				z-index: 2001;
				transition: right 0.3s ease;
				overflow-y: auto;
				padding: 2rem 1.5rem;
				box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
			}
			.auth-drawer.open {
				right: 0;
			}

			.auth-drawer h2 {
				font-size: 1.4rem;
				margin-bottom: 0.25rem;
			}
			.auth-drawer .drawer-subtitle {
				color: #94a3b8;
				font-size: 0.85rem;
				margin-bottom: 1.5rem;
			}

			.auth-tabs {
				display: flex;
				gap: 0;
				margin-bottom: 1.25rem;
				border-bottom: 2px solid #334155;
			}
			.auth-tab {
				flex: 1;
				padding: 0.6rem;
				text-align: center;
				background: none;
				border: none;
				color: #94a3b8;
				font-size: 0.95rem;
				font-weight: 600;
				cursor: pointer;
				border-bottom: 2px solid transparent;
				margin-bottom: -2px;
				transition:
					color 0.2s,
					border-color 0.2s;
			}
			.auth-tab.active {
				color: #f8fafc;
				border-bottom-color: #3b82f6;
			}

			.auth-drawer .form-group {
				margin-bottom: 0.85rem;
			}
			.auth-drawer .form-group input {
				width: 100%;
				padding: 0.6rem 0.8rem;
				background: #0f172a;
				border: 1px solid #334155;
				border-radius: 6px;
				color: #f8fafc;
				font-size: 0.875rem;
				outline: none;
			}
			.auth-drawer .form-group input:focus {
				border-color: #3b82f6;
			}
			.auth-drawer .form-group input::placeholder {
				color: #64748b;
			}

			.auth-drawer .submit-btn {
				width: 100%;
				padding: 0.65rem;
				background: #2563eb;
				color: white;
				border: none;
				border-radius: 6px;
				font-size: 0.9rem;
				font-weight: 600;
				cursor: pointer;
				margin-top: 0.25rem;
			}
			.auth-drawer .submit-btn:hover {
				background: #1d4ed8;
			}

			.auth-drawer .google-btn {
				width: 100%;
				padding: 0.6rem;
				background: #fff;
				color: #0f172a;
				border: 1px solid #cbd5e1;
				border-radius: 6px;
				font-size: 0.85rem;
				font-weight: 600;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
			}
			.auth-drawer .google-btn:hover {
				background: #f1f5f9;
			}
			.auth-drawer .google-btn svg {
				width: 18px;
				height: 18px;
			}

			.auth-drawer .or-divider {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				color: #64748b;
				font-size: 0.75rem;
				margin: 1rem 0;
			}
			.auth-drawer .or-divider::before,
			.auth-drawer .or-divider::after {
				content: '';
				flex: 1;
				border-bottom: 1px solid #334155;
			}

			.auth-drawer .close-btn {
				position: absolute;
				top: 1rem;
				right: 1rem;
				background: none;
				border: none;
				color: #94a3b8;
				font-size: 1.4rem;
				cursor: pointer;
			}
			.auth-drawer .close-btn:hover {
				color: #f8fafc;
			}

			.auth-status {
				margin-top: 0.75rem;
				padding: 0.5rem;
				border-radius: 4px;
				font-size: 0.8rem;
				text-align: center;
				display: none;
			}
			.auth-status.visible {
				display: block;
			}
			.auth-status.error {
				background: #7f1d1d;
				color: #fca5a5;
			}
			.auth-status.success {
				background: #14532d;
				color: #86efac;
			}

			.auth-panel {
				display: none;
			}
			.auth-panel.active {
				display: block;
			}
			/* ---- Player profile modal ---- */
			.profile-overlay {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.45);
				z-index: 2000;
			}
			.profile-overlay.open {
				display: block;
			}

			.profile-modal {
				display: none;
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 440px;
				max-width: 92vw;
				max-height: 82vh;
				overflow-y: auto;
				background: #1e293b;
				color: #f8fafc;
				padding: 2rem 1.5rem;
				border-radius: 10px;
				z-index: 2001;
				box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
			}
			.profile-modal.open {
				display: block;
			}
			.profile-modal .close-btn {
				position: absolute;
				top: 0.75rem;
				right: 1rem;
				background: none;
				border: none;
				color: #94a3b8;
				font-size: 1.4rem;
				cursor: pointer;
			}
			.profile-modal .close-btn:hover {
				color: #f8fafc;
			}
			.profile-modal h2 {
				font-size: 1.25rem;
				margin-bottom: 1.25rem;
			}

			.profile-section {
				margin-bottom: 1.25rem;
				padding-bottom: 1.25rem;
				border-bottom: 1px solid #334155;
			}
			.profile-section:last-child {
				border-bottom: none;
				padding-bottom: 0;
				margin-bottom: 0;
			}
			.profile-section h3 {
				font-size: 0.72rem;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: #94a3b8;
				font-weight: 600;
				margin-bottom: 0.5rem;
			}

			.profile-big-number {
				font-size: 1.8rem;
				font-weight: 700;
				color: #f8fafc;
				line-height: 1.1;
			}

			.profile-hint {
				font-size: 0.8rem;
				color: #94a3b8;
				margin-top: 0.35rem;
				line-height: 1.4;
			}

			.profile-achievements {
				list-style: none;
				padding: 0;
				margin: 0;
			}
			.profile-achievements li {
				padding: 0.6rem 0.75rem;
				border-radius: 6px;
				margin-bottom: 0.4rem;
				background: #0f172a;
				border: 1px solid #334155;
			}
			.profile-achievements li.locked {
				opacity: 0.55;
			}
			.profile-achievements li.unlocked {
				border-color: #3b82f6;
				background: rgba(59, 130, 246, 0.08);
			}
			.profile-achievements li .ach-name {
				font-weight: 600;
				display: block;
				color: #f8fafc;
				font-size: 0.875rem;
			}
			.profile-achievements li .ach-desc {
				font-size: 0.75rem;
				color: #94a3b8;
				display: block;
				margin-top: 0.15rem;
			}
		</style>
	</head>
	<body>
		<header class="site-header">
			<div class="header-inner">
				<a class="logo" href="/">
					<span class="logo-a">A</span>
					<span class="logo-sep">→</span>
					<span class="logo-a">A</span>
					<span class="logo-sub">
						Adamas to Aurum
					</span>
				</a>

				<nav class="header-nav" id="header-nav">
					<a
						href="./pages/events.html"
						class="nav-link hidden"
						id="nav-events"
					>
						Events
					</a>
					<a
						href="./pages/collection.html"
						class="nav-link hidden"
						id="nav-collection"
					>
						Collection
					</a>
					<a
						href="./pages/battle.html"
						class="nav-link hidden"
						id="nav-battle"
					>
						Battle
					</a>
					<a
						href="./pages/console.html"
						class="nav-link nav-link-admin hidden"
						id="nav-console"
					>
						Console
					</a>
				</nav>

				<div class="header-right">
					<span
						id="user-badge"
						class="admin-badge hidden"
					></span>
					<button
						id="btn-profile"
						class="btn btn-sm btn-header hidden"
						onclick="openProfileModal()"
					>
						Profile
					</button>
					<button
						id="btn-logout"
						class="btn btn-sm btn-header hidden"
					>
						Logout
					</button>
					<button
						id="btn-signin"
						onclick="openAuthDrawer()"
						class="btn btn-sm btn-header"
					>
						Sign In
					</button>
				</div>
			</div>
		</header>

		<!-- Offline sync banner — shown when attempts are queued or the device is offline -->
		<div id="offline-banner" class="offline-banner" role="status" aria-live="polite"></div>
		<div id="map"></div>

		<!-- Auth side drawer overlay -->
		<div
			id="auth-overlay"
			class="auth-overlay"
			onclick="closeAuthDrawer()"
		></div>

		<!-- Auth side drawer -->
		<div id="auth-drawer" class="auth-drawer">
			<button class="close-btn" onclick="closeAuthDrawer()">
				&times;
			</button>
			<h2>Adamas2Aurum</h2>
			<p class="drawer-subtitle">
				Sign in or create your account
			</p>

			<div class="auth-tabs">
				<button
					class="auth-tab active"
					onclick="switchAuthTab('login')"
				>
					Log In
				</button>
				<button
					class="auth-tab"
					onclick="switchAuthTab('signup')"
				>
					Sign Up
				</button>
			</div>

			<!-- LOGIN PANEL -->
			<div id="login-panel" class="auth-panel active">
				<button
					class="google-btn"
					onclick="handleDrawerGoogleAuth()"
				>
					<svg viewBox="0 0 24 24">
						<path
							fill="#4285F4"
							d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
						/>
						<path
							fill="#34A853"
							d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
						/>
						<path
							fill="#FBBC05"
							d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
						/>
						<path
							fill="#EA4335"
							d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
						/>
					</svg>
					Log in with Google
				</button>
				<div class="or-divider"><span>or</span></div>
				<form id="drawer-login-pin-form">
					<div class="form-group">
						<input
							type="text"
							id="drawer-login-username"
							placeholder="Username"
							required
							autocomplete="username"
						/>
					</div>
					<div class="form-group">
						<input
							type="password"
							id="drawer-login-pin"
							placeholder="PIN"
							required
							autocomplete="current-password"
						/>
					</div>
					<button
						type="submit"
						class="submit-btn"
					>
						Log In
					</button>
				</form>
			</div>

			<!-- SIGNUP PANEL -->
			<div id="signup-panel" class="auth-panel">
				<button
					class="google-btn"
					onclick="handleDrawerGoogleAuth()"
				>
					<svg viewBox="0 0 24 24">
						<path
							fill="#4285F4"
							d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
						/>
						<path
							fill="#34A853"
							d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
						/>
						<path
							fill="#FBBC05"
							d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
						/>
						<path
							fill="#EA4335"
							d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
						/>
					</svg>
					Sign up with Google
				</button>
				<div class="or-divider"><span>or</span></div>
				<form id="drawer-signup-pin-form">
					<div class="form-group">
						<input
							type="text"
							id="drawer-signup-pin-name"
							placeholder="Display name"
							required
							autocomplete="name"
						/>
					</div>
					<div class="form-group">
						<input
							type="text"
							id="drawer-signup-username"
							placeholder="Username"
							required
							autocomplete="username"
						/>
					</div>
					<div class="form-group">
						<input
							type="password"
							id="drawer-signup-pin"
							placeholder="PIN"
							required
							autocomplete="new-password"
						/>
					</div>
					<div class="form-group">
						<input
							type="password"
							id="drawer-signup-pin-confirm"
							placeholder="Confirm PIN"
							required
							autocomplete="new-password"
						/>
					</div>
					<button
						type="submit"
						class="submit-btn"
					>
						Create Account
					</button>
				</form>
			</div>

			<div id="auth-drawer-status" class="auth-status"></div>
		</div>
			<!-- Player profile modal — points, streak, achievements -->
		<div id="profile-overlay" class="profile-overlay" onclick="closeProfileModal()"></div>
		<div
			id="profile-modal"
			class="profile-modal"
			role="dialog"
			aria-labelledby="profile-name"
		>
			<button class="close-btn" onclick="closeProfileModal()">&times;</button>
			<h2 id="profile-name">Profile</h2>

			<div id="profile-loading" class="profile-hint">Loading your profile…</div>

			<div id="profile-content" style="display: none;">
				<div class="profile-section">
					<h3>Points</h3>
					<p id="profile-points" class="profile-big-number">0</p>
				</div>

				<div class="profile-section">
					<h3>Daily Streak</h3>
					<p id="profile-streak-current" class="profile-big-number">0</p>
					<p id="profile-streak-detail" class="profile-hint"></p>
				</div>

				<div class="profile-section">
					<h3>Achievements</h3>
					<ul id="profile-achievements" class="profile-achievements"></ul>
				</div>
			</div>
		</div>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>
