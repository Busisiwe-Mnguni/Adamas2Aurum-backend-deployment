<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Adamas2Auruma - Interactive Campus Exploration</title>

		<!-- Leaflet CSS & JS -->
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>

		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family:
					-apple-system, BlinkMacSystemFont,
					'Segoe UI', Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
			}

			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				overflow: hidden;
			}

			header {
				background-color: #0c2461;
				color: white;
				padding: 12px 24px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				z-index: 1000;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
			}

			.logo-title {
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 1.2rem;
				font-weight: bold;
			}

			.nav-right {
				display: flex;
				align-items: center;
				gap: 16px;
			}

			.sub-title {
				font-size: 0.85rem;
				opacity: 0.8;
			}

			.auth-link,
			.logout-btn {
				background: #1e3799;
				color: white;
				text-decoration: none;
				padding: 6px 14px;
				border-radius: 4px;
				font-weight: bold;
				font-size: 0.9rem;
				border: 1px solid rgba(255, 255, 255, 0.3);
				transition: background 0.2s ease;
				cursor: pointer;
			}

			.auth-link:hover,
			.logout-btn:hover {
				background: #4a69bd;
			}

			.user-badge {
				font-size: 0.9rem;
				font-weight: bold;
				color: #f8fafc;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			#map {
				flex: 1;
				width: 100%;
				height: calc(100vh - 56px);
			}

			/* ---- Auth side drawer ---- */
			.auth-overlay {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background: rgba(0, 0, 0, 0.4);
				z-index: 2000;
			}
			.auth-overlay.open {
				display: block;
			}

			.auth-drawer {
				position: fixed;
				top: 0;
				right: -420px;
				width: 400px;
				max-width: 90vw;
				height: 100vh;
				background: #1e293b;
				color: #f8fafc;
				z-index: 2001;
				transition: right 0.3s ease;
				overflow-y: auto;
				padding: 2rem 1.5rem;
				box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
			}
			.auth-drawer.open {
				right: 0;
			}

			.auth-drawer h2 {
				font-size: 1.4rem;
				margin-bottom: 0.25rem;
			}
			.auth-drawer .drawer-subtitle {
				color: #94a3b8;
				font-size: 0.85rem;
				margin-bottom: 1.5rem;
			}

			.auth-tabs {
				display: flex;
				gap: 0;
				margin-bottom: 1.25rem;
				border-bottom: 2px solid #334155;
			}
			.auth-tab {
				flex: 1;
				padding: 0.6rem;
				text-align: center;
				background: none;
				border: none;
				color: #94a3b8;
				font-size: 0.95rem;
				font-weight: 600;
				cursor: pointer;
				border-bottom: 2px solid transparent;
				margin-bottom: -2px;
				transition:
					color 0.2s,
					border-color 0.2s;
			}
			.auth-tab.active {
				color: #f8fafc;
				border-bottom-color: #3b82f6;
			}

			.auth-drawer .form-group {
				margin-bottom: 0.85rem;
			}
			.auth-drawer .form-group input {
				width: 100%;
				padding: 0.6rem 0.8rem;
				background: #0f172a;
				border: 1px solid #334155;
				border-radius: 6px;
				color: #f8fafc;
				font-size: 0.875rem;
				outline: none;
			}
			.auth-drawer .form-group input:focus {
				border-color: #3b82f6;
			}
			.auth-drawer .form-group input::placeholder {
				color: #64748b;
			}

			.auth-drawer .submit-btn {
				width: 100%;
				padding: 0.65rem;
				background: #2563eb;
				color: white;
				border: none;
				border-radius: 6px;
				font-size: 0.9rem;
				font-weight: 600;
				cursor: pointer;
				margin-top: 0.25rem;
			}
			.auth-drawer .submit-btn:hover {
				background: #1d4ed8;
			}

			.auth-drawer .google-btn {
				width: 100%;
				padding: 0.6rem;
				background: #fff;
				color: #0f172a;
				border: 1px solid #cbd5e1;
				border-radius: 6px;
				font-size: 0.85rem;
				font-weight: 600;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
			}
			.auth-drawer .google-btn:hover {
				background: #f1f5f9;
			}
			.auth-drawer .google-btn svg {
				width: 18px;
				height: 18px;
			}

			.auth-drawer .or-divider {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				color: #64748b;
				font-size: 0.75rem;
				margin: 1rem 0;
			}
			.auth-drawer .or-divider::before,
			.auth-drawer .or-divider::after {
				content: '';
				flex: 1;
				border-bottom: 1px solid #334155;
			}

			.auth-drawer .close-btn {
				position: absolute;
				top: 1rem;
				right: 1rem;
				background: none;
				border: none;
				color: #94a3b8;
				font-size: 1.4rem;
				cursor: pointer;
			}
			.auth-drawer .close-btn:hover {
				color: #f8fafc;
			}

			.auth-status {
				margin-top: 0.75rem;
				padding: 0.5rem;
				border-radius: 4px;
				font-size: 0.8rem;
				text-align: center;
				display: none;
			}
			.auth-status.visible {
				display: block;
			}
			.auth-status.error {
				background: #7f1d1d;
				color: #fca5a5;
			}
			.auth-status.success {
				background: #14532d;
				color: #86efac;
			}

			.auth-panel {
				display: none;
			}
			.auth-panel.active {
				display: block;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="logo-title">
				<span>🏛️ Adamas2Auruma</span>
			</div>
			<a class="logo" href="./pages/battle.html">
				<span class="logo-a">A</span>
				<span class="logo-sep">2</span>
				<span class="logo-a">A</span>
				<span class="logo-sub">Battle</span>
			</a>
			<div class="nav-right">
				<span class="sub-title">
					Interactive Campus Exploration
				</span>
				<div id="auth-nav-container">
					<a
						href="/pages/auth.html"
						class="auth-link"
					>
						Sign In / Register
					</a>
				</div>
			</div>
		</header>

		<div id="map"></div>

		<!-- Auth side drawer overlay -->
		<div
			id="auth-overlay"
			class="auth-overlay"
			onclick="closeAuthDrawer()"
		></div>

		<!-- Auth side drawer -->
		<div id="auth-drawer" class="auth-drawer">
			<button class="close-btn" onclick="closeAuthDrawer()">
				&times;
			</button>
			<h2>Adamas2Aurum</h2>
			<p class="drawer-subtitle">
				Sign in or create your account
			</p>

			<div class="auth-tabs">
				<button
					class="auth-tab active"
					onclick="switchAuthTab('login')"
				>
					Log In
				</button>
				<button
					class="auth-tab"
					onclick="switchAuthTab('signup')"
				>
					Sign Up
				</button>
			</div>

			<!-- LOGIN PANEL -->
			<div id="login-panel" class="auth-panel active">
				<button
					class="google-btn"
					onclick="handleDrawerGoogleAuth()"
				>
					<svg viewBox="0 0 24 24">
						<path
							fill="#4285F4"
							d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
						/>
						<path
							fill="#34A853"
							d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
						/>
						<path
							fill="#FBBC05"
							d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
						/>
						<path
							fill="#EA4335"
							d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
						/>
					</svg>
					Log in with Google
				</button>
				<div class="or-divider"><span>or</span></div>
				<form id="drawer-login-form">
					<div class="form-group">
						<input
							type="email"
							id="drawer-login-email"
							placeholder="Email address"
							required
							autocomplete="email"
						/>
					</div>
					<div class="form-group">
						<input
							type="password"
							id="drawer-login-password"
							placeholder="Password"
							required
							autocomplete="current-password"
						/>
					</div>
					<button
						type="submit"
						class="submit-btn"
					>
						Log In
					</button>
				</form>
			</div>

			<!-- SIGNUP PANEL -->
			<div id="signup-panel" class="auth-panel">
				<button
					class="google-btn"
					onclick="handleDrawerGoogleAuth()"
				>
					<svg viewBox="0 0 24 24">
						<path
							fill="#4285F4"
							d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
						/>
						<path
							fill="#34A853"
							d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
						/>
						<path
							fill="#FBBC05"
							d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
						/>
						<path
							fill="#EA4335"
							d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
						/>
					</svg>
					Sign up with Google
				</button>
				<div class="or-divider"><span>or</span></div>
				<form id="drawer-signup-form">
					<div class="form-group">
						<input
							type="text"
							id="drawer-signup-name"
							placeholder="Display name"
							required
							autocomplete="name"
						/>
					</div>
					<div class="form-group">
						<input
							type="email"
							id="drawer-signup-email"
							placeholder="Email address"
							required
							autocomplete="email"
						/>
					</div>
					<div class="form-group">
						<input
							type="password"
							id="drawer-signup-password"
							placeholder="Password (min 8 chars)"
							required
							minlength="8"
							autocomplete="new-password"
						/>
					</div>
					<button
						type="submit"
						class="submit-btn"
					>
						Create Account
					</button>
				</form>
			</div>

			<div id="auth-drawer-status" class="auth-status"></div>
		</div>

		<script type="module" src="/js/auth-client.bundle.mjs"></script>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>
