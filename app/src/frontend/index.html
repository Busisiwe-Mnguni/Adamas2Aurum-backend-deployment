<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adamas2Auruma - Interactive Campus Exploration</title>

    <!-- Leaflet CSS & JS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      header {
        background-color: #0c2461;
        color: white;
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }

      .logo-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.2rem;
        font-weight: bold;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .sub-title {
        font-size: 0.85rem;
        opacity: 0.8;
      }

      .auth-link, .logout-btn {
        background: #1e3799;
        color: white;
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: background 0.2s ease;
        cursor: pointer;
      }

      .auth-link:hover, .logout-btn:hover {
        background: #4a69bd;
      }

      .user-badge {
        font-size: 0.9rem;
        font-weight: bold;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #map {
        flex: 1;
        width: 100%;
        height: calc(100vh - 56px);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-title">
        <span>🏛️ Adamas2Auruma</span>
      </div>
      <div class="nav-right">
        <span class="sub-title">Interactive Campus Exploration</span>
        <div id="auth-nav-container">
          <a href="/pages/auth.html" class="auth-link">Sign In / Register</a>
        </div>
      </div>
    </header>

    <div id="map"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
