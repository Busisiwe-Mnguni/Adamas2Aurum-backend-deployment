<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adamas2Aurum — Sign In</title>
  <style>
    :root {
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e1b4b;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #334155;
      --input-focus: #3b82f6;
      --btn-primary: #2563eb;
      --btn-primary-hover: #1d4ed8;
      --btn-secondary-bg: #ffffff;
      --btn-secondary-text: #0f172a;
      --btn-secondary-border: #cbd5e1;
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .auth-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      border: 1px solid #334155;
    }

    .header-link {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-link h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .header-link p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      margin-top: 1.5rem;
      margin-bottom: 0.25rem;
    }

    .section-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1rem;
    }

    .google-btn {
      width: 100%;
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--btn-secondary-border);
      border-radius: 6px;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }

    .google-btn:hover {
      background-color: #f1f5f9;
    }

    .google-btn svg {
      width: 18px;
      height: 18px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin: 1.25rem 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #334155;
    }

    .divider::before {
      margin-right: .5em;
    }

    .divider::after {
      margin-left: .5em;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--input-focus);
    }

    .form-group input::placeholder {
      color: #64748b;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--btn-primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.25rem;
    }

    .submit-btn:hover {
      background-color: var(--btn-primary-hover);
    }

    .form-error {
      color: var(--error-color);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
      text-align: center;
    }

    .back-nav {
      margin-top: 1.5rem;
      text-align: center;
    }

    .back-nav a {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .back-nav a:hover {
      color: var(--text-main);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="header-link">
      <h1>Adamas2Aurum</h1>
      <p>Sign in or create your account</p>
    </div>

    <div class="section-title">Sign Up</div>
    <div class="section-subtitle">New here? Create an account with Google or email.</div>

    <button type="button" class="google-btn" id="signup-google-btn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign up with Google
    </button>

    <div class="divider">or</div>

    <form id="signup-form">
      <div class="form-group">
        <input type="text" id="signup-name" placeholder="Display name" required>
      </div>
      <div class="form-group">
        <input type="email" id="signup-email" placeholder="Email address" required>
      </div>
      <div class="form-group">
        <input type="password" id="signup-password" placeholder="Password (min 8 characters)" minlength="8" required>
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
      <div class="form-error" id="signup-error"></div>
    </form>

    <div class="section-title" style="margin-top: 2rem;">Log In</div>
    <div class="section-subtitle">Already have an account? Sign in below.</div>

    <button type="button" class="google-btn" id="login-google-btn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Log in with Google
    </button>

    <div class="divider">or</div>

    <form id="login-form">
      <div class="form-group">
        <input type="email" id="login-email" placeholder="Email address" required>
      </div>
      <div class="form-group">
        <input type="password" id="login-password" placeholder="Password" required>
      </div>
      <button type="submit" class="submit-btn">Log In</button>
      <div class="form-error" id="login-error"></div>
    </form>

    <div class="back-nav">
      <a href="../index.html">← Return to Map</a>
    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
