<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2A — Sign In</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .auth-wrap { max-width: 420px; margin: 3rem auto; }

    .auth-tabs {
      display: flex; gap: 0.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }
    .auth-tab {
      background: none; border: none;
      border-bottom: 3px solid transparent;
      padding: 0.55rem 1.1rem;
      font-size: 0.95rem; font-weight: 500;
      color: var(--text-muted); cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .auth-tab:hover   { color: var(--text); }
    .auth-tab.active  {
      color: var(--accent, #a78bfa);
      border-bottom-color: var(--accent, #a78bfa);
    }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .social-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      width: 100%; padding: 0.6rem 1rem;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: var(--font-body);
    }
    .social-btn:hover { background: var(--surface-2); border-color: var(--text-muted); }
    .social-btn svg { width: 18px; height: 18px; }

    .divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 1.25rem 0; color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .field { margin-bottom: 1rem; }
    .field label { display: block; margin-bottom: 0.35rem; }
    .field input {
      width: 100%; padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface-2); color: var(--text);
      font-family: var(--font-body); font-size: 0.9rem;
      outline: none; transition: border-color 0.18s, box-shadow 0.18s;
    }
    .field input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .error-msg {
      color: var(--danger); font-size: 0.85rem;
      margin-bottom: 0.75rem; display: none;
    }
    .error-msg.show { display: block; }

    .submit-btn {
      width: 100%; padding: 0.6rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
      font-family: var(--font-body);
    }
    .submit-btn:hover { background: var(--accent-light); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .hint {
      font-size: 0.78rem; color: var(--text-muted);
      margin-top: 0.5rem; text-align: center;
    }
  </style>
<base target="_blank">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="../index.html">
        <span class="logo-a">A</span>
        <span class="logo-sep">→</span>
        <span class="logo-a">A</span>
        <span class="logo-sub">Adamas to Aurum</span>
      </a>
    </div>
  </header>

  <main class="main">
    <div id="toast" class="toast" aria-live="polite"></div>

    <div class="auth-wrap">
      <div class="form-card">
        <h2 class="page-title" style="margin-bottom:1.25rem;font-size:1.35rem;">
          Welcome to A2A
        </h2>

        <!-- Tabs -->
        <nav class="auth-tabs">
          <button class="auth-tab active" data-panel="login">Sign In</button>
          <button class="auth-tab" data-panel="register">Register</button>
        </nav>

        <!-- SIGN IN PANEL -->
        <div id="panel-login" class="auth-panel active">
          <button class="social-btn" id="btn-google-signin">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
          </button>

          <div class="divider">or use email</div>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="login-email">Email</label>
              <input id="login-email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="login-pin">PIN</label>
              <input id="login-pin" type="password" placeholder="1234" required />
            </div>
            <div id="login-error" class="error-msg"></div>
            <button type="submit" class="submit-btn" id="btn-login">Sign In</button>
          </form>
        </div>

        <!-- REGISTER PANEL -->
        <div id="panel-register" class="auth-panel">
          <button class="social-btn" id="btn-google-signup">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign up with Google
          </button>

          <div class="divider">or use email</div>

          <form id="register-form" novalidate>
            <div class="field">
              <label for="reg-name">Display Name</label>
              <input id="reg-name" type="text" placeholder="Your name" required />
            </div>
            <div class="field">
              <label for="reg-email">Email</label>
              <input id="reg-email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="reg-pin">PIN</label>
              <input id="reg-pin" type="password" placeholder="Choose a 4-digit PIN" required />
            </div>
            <div class="field">
              <label for="reg-confirm">Confirm PIN</label>
              <input id="reg-confirm" type="password" placeholder="Re-enter PIN" required />
            </div>
            <div id="register-error" class="error-msg"></div>
            <button type="submit" class="submit-btn" id="btn-register">Create Account</button>
            <p class="hint">Your email is your login identifier.</p>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
