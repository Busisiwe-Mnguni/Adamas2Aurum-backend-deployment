<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adamas2Aurum — Sign In</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>Adamas2Aurum</h1>
      <p class="subtitle">Sign in or create your account</p>

      <!-- ===================== SIGN UP ===================== -->
      <section class="auth-section">
        <h2>Sign Up</h2>
        <p class="hint">New here? Create an account with Google or email.</p>

        <!-- Google Sign Up -->
        <div class="button-group">
          <button id="signup-google" class="btn btn-google" onclick="handleGoogleSignUp()">
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Sign up with Google
          </button>
        </div>

        <div class="or-divider"><span>or</span></div>

        <!-- Email/Password Sign Up Form -->
        <form id="signup-form" class="auth-form" onsubmit="handleEmailSignUp(event)">
          <div class="form-group">
            <input type="text" id="signup-name" name="name" placeholder="Display name" required autocomplete="name">
          </div>
          <div class="form-group">
            <input type="email" id="signup-email" name="email" placeholder="Email address" required autocomplete="email">
          </div>
          <div class="form-group">
            <input type="password" id="signup-password" name="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
      </section>

      <hr class="divider">

      <!-- ===================== LOG IN ===================== -->
      <section class="auth-section">
        <h2>Log In</h2>
        <p class="hint">Already have an account? Sign in below.</p>

        <!-- Google Log In -->
        <div class="button-group">
          <button id="login-google" class="btn btn-google" onclick="handleGoogleLogin()">
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Log in with Google
          </button>
        </div>

        <div class="or-divider"><span>or</span></div>

        <!-- Email/Password Log In Form -->
        <form id="login-form" class="auth-form" onsubmit="handleEmailLogin(event)">
          <div class="form-group">
            <input type="email" id="login-email" name="email" placeholder="Email address" required autocomplete="email">
          </div>
          <div class="form-group">
            <input type="password" id="login-password" name="password" placeholder="Password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary">Log In</button>
        </form>

        <p class="forgot-link">
          <a href="#" onclick="handleForgotPassword(event)">Forgot password?</a>
        </p>
      </section>

      <div id="status" class="status hidden"></div>
    </div>
  </div>

  <script type="module" src="/js/auth-client.bundle.mjs"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
