<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2A — Interactive Campus Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="../css/style.css" />

  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }

    .app-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      gap: 1rem;
      z-index: 1000;
    }
    .app-header h1 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--gold);
      margin: 0;
    }
    .header-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .map-container {
      position: fixed;
      top: 52px; bottom: 0; left: 0; right: 0;
    }
    #map { width: 100%; height: 100%; }

    .event-popup h3 { margin: 0 0 4px; font-size: 0.95rem; font-weight: 600; }
    .event-popup p  { margin: 0 0 6px; font-size: 0.82rem; color: #555; }
    .location-tag   { font-size: 0.72rem; color: #888; }
    .popup-actions  { margin-top: 8px; }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>🏛️ Adamas to Aurum</h1>
    <span class="header-subtitle">Interactive Campus Exploration</span>
  </header>

  <main class="map-container">
    <div id="map"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
