<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Adamas to Aurum — Sign in</title>

		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<link rel="stylesheet" href="../css/style.css" />

		<style>
			:root {
				--gold: #f1c40f;
				--gold-dark: #d4ac0d;
				--navy: #0c2461;
				--navy-light: #1e3799;
			}

			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
				font-family: var(--font-body);
			}

			.landing {
				display: flex;
				height: 100vh;
				width: 100%;
			}

			/* ── Left: map ── */
			.landing-map {
				flex: 1.4;
				position: relative;
				min-width: 0;
			}
			#map {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
			.map-banner {
				position: absolute;
				top: 1.25rem;
				left: 1.25rem;
				z-index: 500;
				background: rgba(12, 36, 97, 0.92);
				color: #fff;
				padding: 0.9rem 1.2rem;
				border-radius: 12px;
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
				border-left: 4px solid var(--gold);
				max-width: 320px;
			}
			.map-banner h1 {
				font-size: 1.15rem;
				margin: 0 0 0.2rem;
				font-weight: 800;
			}
			.map-banner .gold {
				color: var(--gold);
			}
			.map-banner p {
				font-size: 0.8rem;
				margin: 0;
				color: rgba(255, 255, 255, 0.82);
			}

			.event-popup h3 {
				margin: 0 0 4px;
				font-size: 0.95rem;
				font-weight: 600;
			}
			.event-popup p {
				margin: 0 0 6px;
				font-size: 0.82rem;
				color: #555;
			}
			.location-tag {
				font-size: 0.72rem;
				color: #888;
			}

			/* ── Right: auth ── */
			.landing-auth {
				flex: 0 0 440px;
				max-width: 440px;
				background: var(--navy);
				color: #fff;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 2rem 2.5rem;
				overflow-y: auto;
			}
			.auth-logo {
				font-size: 1.6rem;
				font-weight: 800;
				margin-bottom: 0.25rem;
			}
			.auth-logo .a {
				color: var(--gold);
			}
			.auth-logo .sep {
				color: rgba(255, 255, 255, 0.5);
				margin: 0 0.2rem;
			}
			.auth-subtitle {
				font-size: 0.82rem;
				color: rgba(255, 255, 255, 0.6);
				margin-bottom: 1.75rem;
			}

			.auth-tabs {
				display: flex;
				gap: 0.25rem;
				margin-bottom: 1.5rem;
				border: 1px solid rgba(255, 255, 255, 0.18);
				border-radius: 8px;
				overflow: hidden;
			}
			.auth-tab {
				flex: 1;
				padding: 0.6rem;
				background: transparent;
				border: none;
				cursor: pointer;
				font-weight: 600;
				font-size: 0.85rem;
				color: rgba(255, 255, 255, 0.6);
				transition:
					background var(--transition),
					color var(--transition);
			}
			.auth-tab.active {
				background: var(--gold);
				color: var(--navy);
			}

			.landing-auth .field {
				margin-bottom: 1rem;
			}
			.landing-auth label {
				display: block;
				font-size: 0.78rem;
				color: rgba(255, 255, 255, 0.7);
				margin-bottom: 0.3rem;
				font-weight: 500;
			}
			.landing-auth .req {
				color: var(--gold);
			}
			.landing-auth input {
				width: 100%;
				padding: 0.6rem 0.7rem;
				border-radius: 8px;
				border: 1px solid rgba(255, 255, 255, 0.2);
				background: rgba(255, 255, 255, 0.06);
				color: #fff;
				font-size: 0.9rem;
				font-family: var(--font-body);
			}
			.landing-auth input::placeholder {
				color: rgba(255, 255, 255, 0.35);
			}
			.landing-auth input:focus {
				outline: none;
				border-color: var(--gold);
				background: rgba(255, 255, 255, 0.1);
			}

			.btn-gold {
				width: 100%;
				padding: 0.7rem;
				border-radius: 8px;
				border: none;
				background: var(--gold);
				color: var(--navy);
				font-weight: 700;
				font-size: 0.9rem;
				cursor: pointer;
				transition: background var(--transition);
			}
			.btn-gold:hover {
				background: var(--gold-dark);
			}
			.btn-gold:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			.state-msg.error {
				color: #ff9b9b;
				padding: 0.4rem 0;
				font-size: 0.82rem;
			}

			.hidden {
				display: none !important;
			}

			@media (max-width: 720px) {
				.landing {
					flex-direction: column;
				}
				.landing-map {
					flex: 0 0 42vh;
				}
				.landing-auth {
					flex: 1;
					max-width: none;
					padding: 1.5rem 1.25rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="landing">
			<section class="landing-map">
				<div class="map-banner">
					<h1>
						<span class="gold">A</span>
						damas
						<span class="gold">→</span>
						<span class="gold">A</span>
						urum
					</h1>
					<p>
						A location-based campus trivia &
						card game. Sign in to take on
						live challenges.
					</p>
				</div>
				<div id="map"></div>
			</section>

			<aside class="landing-auth">
				<div class="auth-logo">
					<span class="a">A</span>
					<span class="sep">→</span>
					<span class="a">A</span>
				</div>
				<p class="auth-subtitle">Adamas to Aurum</p>

				<div class="auth-tabs">
					<button
						type="button"
						class="auth-tab active"
						data-tab="signin"
						id="tab-signin"
					>
						Sign in
					</button>
					<button
						type="button"
						class="auth-tab"
						data-tab="signup"
						id="tab-signup"
					>
						Sign up
					</button>
				</div>

				<!-- Sign in -->
				<form id="signin-form" novalidate>
					<div class="field">
						<label for="signin-email">
							Email
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signin-email"
							type="text"
							placeholder="your@email.com"
							autocomplete="email"
							required
						/>
					</div>
					<div
						class="field"
						style="margin-bottom: 1.5rem"
					>
						<label for="signin-pin">
							PIN
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signin-pin"
							type="password"
							placeholder="1234"
							autocomplete="current-password"
							required
						/>
					</div>
					<div
						id="signin-error"
						class="state-msg error hidden"
					></div>
					<button
						type="submit"
						class="btn-gold"
						id="btn-signin"
					>
						Sign in
					</button>
				</form>

				<!-- Sign up -->
				<form
					id="signup-form"
					class="hidden"
					novalidate
				>
					<div class="field">
						<label for="signup-name">
							Name
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signup-name"
							type="text"
							placeholder="Your name"
							required
						/>
					</div>
					<div class="field">
						<label for="signup-email">
							Email
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signup-email"
							type="text"
							placeholder="your@email.com"
							autocomplete="email"
							required
						/>
					</div>
					<div class="field">
						<label for="signup-pin">
							PIN (min 4)
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signup-pin"
							type="password"
							placeholder="1234"
							autocomplete="new-password"
							required
						/>
					</div>
					<div
						class="field"
						style="margin-bottom: 1.5rem"
					>
						<label for="signup-pin2">
							Confirm PIN
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signup-pin2"
							type="password"
							placeholder="1234"
							autocomplete="new-password"
							required
						/>
					</div>
					<div
						id="signup-error"
						class="state-msg error hidden"
					></div>
					<button
						type="submit"
						class="btn-gold"
						id="btn-signup"
					>
						Create account
					</button>
				</form>
			</aside>
		</div>

		<div id="toast" class="toast" aria-live="polite"></div>

		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>

		<script type="module" src="../js/main.js"></script>
	</body>
</html>
