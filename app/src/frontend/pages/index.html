<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Metadata for Character Encoding & Responsive Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adamas2Auruma - Interactive Campus Map</title>

    <!-- Leaflet.js Core CSS Stylesheet (Required for OpenStreetMap map controls & tiles) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Project's Single Unified CSS File -->
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>

    <!-- Main Navigation / Header Bar -->
    <header class="app-header">
      <h1>🏛️ Adamas2Auruma</h1>
      <span class="header-subtitle">Interactive Campus Exploration</span>
    </header>

    <!-- Map Wrapper Container -->
    <main class="map-container">
      <!-- The map element where Leaflet will render the OpenStreetMap view -->
      <div id="map"></div>
    </main>

    <!-- Leaflet.js Core JavaScript Library -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Application Entry Point -->
    <script type="module" src="./src/main.js"></script>

  </body>
</html>
