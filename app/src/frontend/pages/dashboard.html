<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Adamas2Aurum — Dashboard</title>
		<link rel="stylesheet" href="/css/auth.css" />
	</head>
	<body>
		<div class="container">
			<div class="dashboard-card">
				<h1>Adamas2Aurum</h1>
				<div id="user-info" class="user-info">
					<p>Loading session…</p>
				</div>
				<button
					id="signout-btn"
					class="btn btn-secondary"
					onclick="handleSignOut()"
				>
					Sign Out
				</button>
				<hr class="divider" />
				<div class="danger-zone">
					<p class="hint">
						Permanently delete your account
						and all associated data.
					</p>
					<button
						id="delete-btn"
						class="btn btn-danger"
						onclick="handleDeleteAccount()"
					>
						Delete My Account
					</button>
				</div>
			</div>
		</div>

		<script type="module" src="/js/auth-client.bundle.mjs"></script>
		<script type="module">
			// authClient is loaded globally by auth-client.bundle.mjs
			const authClient = window.authClient

			// Check session on page load
			async function loadSession() {
				const { data, error } =
					await authClient.getSession()
				const infoEl =
					document.getElementById('user-info')

				if (error || !data) {
					infoEl.innerHTML =
						"<p class='error'>Not signed in. <a href='/'>Go to sign in</a></p>"
					document.getElementById(
						'signout-btn'
					).style.display = 'none'
					document.getElementById(
						'delete-btn'
					).style.display = 'none'
					return
				}

				const { user } = data
				infoEl.innerHTML = `
        <div class="user-details">
          ${user.image ? `<img src="${user.image}" alt="Profile" class="avatar">` : ''}
          <div>
            <p class="user-name">${user.name || 'Player'}</p>
            <p class="user-email">${user.email || ''}</p>
            <p class="user-id">ID: ${user.id}</p>
          </div>
        </div>
        <p class="welcome">Welcome to Adamas2Aurum! Your identity is confirmed.</p>
      `
			}

			window.handleSignOut = async function () {
				await authClient.signOut()
				window.location.href = '/'
			}

			window.handleDeleteAccount = async function () {
				const confirmed = confirm(
					'Are you sure you want to permanently delete your account?\n\n' +
						'This action cannot be undone. All your data will be removed.'
				)
				if (!confirmed) return

				// For email/password users, prompt for password confirmation
				const password = prompt(
					'Enter your password to confirm account deletion:\n(Leave empty if you signed in with Google)'
				)

				const deleteOpts = { callbackURL: '/' }
				if (password) {
					deleteOpts.password = password
				}

				const { error } =
					await authClient.deleteUser(deleteOpts)

				if (error) {
					alert(
						'Account deletion failed: ' +
							error.message
					)
				} else {
					window.location.href = '/'
				}
			}

			loadSession()
		</script>
	</body>
</html>
