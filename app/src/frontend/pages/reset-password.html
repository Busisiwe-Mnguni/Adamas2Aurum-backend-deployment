<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Adamas2Aurum — Reset Password</title>
		<link rel="stylesheet" href="/css/auth.css" />
	</head>
	<body>
		<div class="container">
			<div class="auth-card">
				<h1>Adamas2Aurum</h1>
				<p class="subtitle">Reset your password</p>

				<div id="reset-content">
					<p class="hint">
						Enter your new password below.
					</p>
					<form
						id="reset-form"
						class="auth-form"
						onsubmit="
							handleResetPassword(
								event
							)
						"
					>
						<div class="form-group">
							<input
								type="password"
								id="new-password"
								name="password"
								placeholder="New password (min 8 characters)"
								required
								minlength="8"
								autocomplete="new-password"
							/>
						</div>
						<div class="form-group">
							<input
								type="password"
								id="confirm-password"
								name="confirm-password"
								placeholder="Confirm new password"
								required
								minlength="8"
								autocomplete="new-password"
							/>
						</div>
						<button
							type="submit"
							class="btn btn-primary"
						>
							Reset Password
						</button>
					</form>
				</div>

				<div id="status" class="status hidden"></div>

				<p style="margin-top: 1.5rem">
					<a href="/">← Back to sign in</a>
				</p>
			</div>
		</div>

		<script type="module" src="/js/auth-client.bundle.mjs"></script>
		<script type="module">
			const authClient = window.authClient

			// Extract the token from the URL query string
			const params = new URLSearchParams(
				window.location.search
			)
			const token = params.get('token')
			const resetError = params.get('error')

			const statusEl = document.getElementById('status')
			const contentEl =
				document.getElementById('reset-content')

			if (resetError) {
				statusEl.className = 'status error'
				statusEl.textContent =
					'This reset link is invalid or has expired. Please request a new one.'
				contentEl.style.display = 'none'
			} else if (!token) {
				statusEl.className = 'status error'
				statusEl.textContent =
					'No reset token found. Please request a password reset from the sign-in page.'
				contentEl.style.display = 'none'
			}

			window.handleResetPassword = async function (event) {
				event.preventDefault()
				const newPw =
					document.getElementById(
						'new-password'
					).value
				const confirmPw =
					document.getElementById(
						'confirm-password'
					).value

				if (newPw !== confirmPw) {
					statusEl.className = 'status error'
					statusEl.textContent =
						'Passwords do not match.'
					return
				}

				const { data, error } =
					await authClient.resetPassword({
						newPassword: newPw,
						token: token,
					})

				if (error) {
					statusEl.className = 'status error'
					statusEl.textContent =
						'Reset failed: ' + error.message
				} else {
					statusEl.className = 'status success'
					statusEl.textContent =
						'Password reset successfully! Redirecting to sign in…'
					contentEl.style.display = 'none'
					setTimeout(() => {
						window.location.href = '/'
					}, 2000)
				}
			}
		</script>
	</body>
</html>
