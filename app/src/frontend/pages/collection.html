<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>A2A — My Collection</title>
		<link rel="stylesheet" href="../css/style.css" />
		<link rel="stylesheet" href="../css/collection.css" />
	</head>
	<body>
		<header class="site-header">
			<div class="header-inner">
				<a class="logo" href="/">
					<span class="logo-a">A</span>
					<span class="logo-sep">→</span>
					<span class="logo-a">A</span>
					<span class="logo-sub">
						Adamas to Aurum
					</span>
				</a>
				<nav class="header-nav">
					<a href="events.html" class="nav-link">Events</a>
					<a href="collection.html" class="nav-link nav-link-active">Collection</a>
				</nav>
				<div class="header-right">
					<span
						class="admin-badge"
						id="user-badge"
						style="display: none"
					></span>
					<button
						class="btn btn-ghost btn-sm"
						id="btn-logout"
						style="
							display: none;
							color: rgba(255,255,255,0.7);
							border-color: rgba(255,255,255,0.3);
						"
					>
						Logout
					</button>
				</div>
			</div>
		</header>

		<main class="main">
			<div id="toast" class="toast" aria-live="polite"></div>

			<!-- Login wall — shown if not authenticated -->
			<div id="login-view" class="hidden">
				<div style="max-width:380px;margin:3rem auto;">
					<div class="form-card">
						<h2
							class="page-title"
							style="margin-bottom:0.5rem;font-size:1.4rem;"
						>
							Sign in to view your Collection
						</h2>
						<p
							class="page-subtitle"
							style="margin-bottom:1.5rem;"
						>
							Log in to browse the cards you've earned on campus.
						</p>
						<form id="login-form" novalidate>
							<div class="field" style="margin-bottom:1rem;">
								<label for="login-email">
									Email
									<span class="req">*</span>
								</label>
								<input
									id="login-email"
									type="text"
									placeholder="your@email.com"
									required
								/>
							</div>
							<div class="field" style="margin-bottom:1.5rem;">
								<label for="login-pin">
									PIN
									<span class="req">*</span>
								</label>
								<input
									id="login-pin"
									type="password"
									placeholder="1234"
									required
								/>
							</div>
							<div
								id="login-error"
								class="state-msg error hidden"
								style="padding:0.5rem 0;"
							></div>
							<button
								type="submit"
								class="btn btn-primary"
								id="btn-login"
								style="width:100%;"
							>
								Sign in
							</button>
						</form>
					</div>
				</div>
			</div>

			<!-- Collection — hidden until authenticated -->
			<div id="collection-content" class="hidden">
				<div class="page-header">
					<div>
						<h1 class="page-title">My Collection</h1>
						<p class="page-subtitle" id="collection-subtitle">
							Loading…
						</p>
					</div>
					<!-- Filter controls -->
					<div class="collection-filters" id="collection-filters" style="display:none;">
						<select id="filter-category" class="filter-select">
							<option value="">All categories</option>
							<option value="CHARACTER">Character</option>
							<option value="LOCATION">Location</option>
							<option value="INFLUENCE">Influence</option>
							<option value="HISTORICAL">Historical</option>
						</select>
						<select id="filter-rarity" class="filter-select">
							<option value="">All rarities</option>
							<option value="COMMON">Common</option>
							<option value="RARE">Rare</option>
							<option value="LEGENDARY">Legendary</option>
						</select>
					</div>
				</div>

				<div id="loading" class="state-msg">Loading your cards…</div>
				<div id="empty" class="state-msg hidden">
					No cards yet — head out to campus events to earn your first one.
				</div>
				<div id="error" class="state-msg error hidden"></div>

				<ul id="card-list" class="collection-grid"></ul>
			</div>
		</main>

		<script type="module" src="../js/collection.js"></script>
	</body>
</html>
