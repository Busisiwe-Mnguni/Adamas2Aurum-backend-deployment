<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Adamas to Aurum — Sign in</title>

		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<link rel="stylesheet" href="/css/style.css" />

		<style>
			:root {
				--gold: #f1c40f;
				--gold-dark: #d4ac0d;
				--navy: #0c2461;
				--navy-light: #1e3799;
			}

			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
				font-family: var(--font-body);
			}

			.landing {
				display: flex;
				height: 100vh;
				width: 100%;
			}

			/* ── Left: map ── */
			.landing-map {
				flex: 1.4;
				position: relative;
				min-width: 0;
			}
			#map {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
			.map-banner {
				position: absolute;
				top: 1.25rem;
				left: 1.25rem;
				z-index: 500;
				background: rgba(12, 36, 97, 0.92);
				color: #fff;
				padding: 0.9rem 1.2rem;
				border-radius: 12px;
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
				border-left: 4px solid var(--gold);
				max-width: 320px;
			}
			.map-banner h1 {
				font-size: 1.15rem;
				margin: 0 0 0.2rem;
				font-weight: 800;
			}
			.map-banner .gold {
				color: var(--gold);
			}
			.map-banner p {
				font-size: 0.8rem;
				margin: 0;
				color: rgba(255, 255, 255, 0.82);
			}

			.event-popup h3 {
				margin: 0 0 4px;
				font-size: 0.95rem;
				font-weight: 600;
			}
			.event-popup p {
				margin: 0 0 6px;
				font-size: 0.82rem;
				color: #555;
			}
			.location-tag {
				font-size: 0.72rem;
				color: #888;
			}

			/* ── Right: auth ── */
			.landing-auth {
				flex: 0 0 440px;
				max-width: 440px;
				background: var(--navy);
				color: #fff;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 2rem 2.5rem;
				overflow-y: auto;
			}
			.auth-logo {
				font-size: 1.6rem;
				font-weight: 800;
				margin-bottom: 0.25rem;
			}
			.auth-logo .a {
				color: var(--gold);
			}
			.auth-logo .sep {
				color: rgba(255, 255, 255, 0.5);
				margin: 0 0.2rem;
			}
			.auth-subtitle {
				font-size: 0.82rem;
				color: rgba(255, 255, 255, 0.6);
				margin-bottom: 1.5rem;
			}

			.auth-tabs {
				display: flex;
				gap: 0.25rem;
				margin-bottom: 1.5rem;
				border: 1px solid rgba(255, 255, 255, 0.18);
				border-radius: 8px;
				overflow: hidden;
			}
			.auth-tab {
				flex: 1;
				padding: 0.6rem;
				background: transparent;
				border: none;
				cursor: pointer;
				font-weight: 600;
				font-size: 0.85rem;
				color: rgba(255, 255, 255, 0.6);
				transition:
					background var(--transition),
					color var(--transition);
			}
			.auth-tab.active {
				background: var(--gold);
				color: var(--navy);
			}

			.landing-auth .field {
				margin-bottom: 1rem;
			}
			.landing-auth label {
				display: block;
				font-size: 0.78rem;
				color: rgba(255, 255, 255, 0.7);
				margin-bottom: 0.3rem;
				font-weight: 500;
			}
			.landing-auth .req {
				color: var(--gold);
			}
			.landing-auth input {
				width: 100%;
				padding: 0.6rem 0.7rem;
				border-radius: 8px;
				border: 1px solid rgba(255, 255, 255, 0.2);
				background: rgba(255, 255, 255, 0.06);
				color: #fff;
				font-size: 0.9rem;
				font-family: var(--font-body);
			}
			.landing-auth input::placeholder {
				color: rgba(255, 255, 255, 0.35);
			}
			.landing-auth input:focus {
				outline: none;
				border-color: var(--gold);
				background: rgba(255, 255, 255, 0.1);
			}

			.btn-gold {
				width: 100%;
				padding: 0.7rem;
				border-radius: 8px;
				border: none;
				background: var(--gold);
				color: var(--navy);
				font-weight: 700;
				font-size: 0.9rem;
				cursor: pointer;
				transition: background var(--transition);
			}
			.btn-gold:hover {
				background: var(--gold-dark);
			}
			.btn-gold:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			.btn-google {
				width: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				padding: 0.6rem;
				border-radius: 8px;
				border: 1px solid rgba(255, 255, 255, 0.25);
				background: #fff;
				color: #1a1a2e;
				font-weight: 600;
				font-size: 0.85rem;
				cursor: pointer;
				transition: background 0.15s;
			}
			.btn-google:hover {
				background: #f5f5f5;
			}
			.btn-google svg {
				width: 18px;
				height: 18px;
			}

			.or-divider {
				display: flex;
				align-items: center;
				text-align: center;
				margin: 1rem 0;
				color: rgba(255, 255, 255, 0.4);
				font-size: 0.78rem;
			}
			.or-divider::before,
			.or-divider::after {
				content: '';
				flex: 1;
				border-bottom: 1px solid
					rgba(255, 255, 255, 0.18);
			}
			.or-divider span {
				padding: 0 0.75rem;
			}

			.forgot-link {
				text-align: center;
				margin: 0.75rem 0 0;
			}
			.forgot-link a {
				color: rgba(255, 255, 255, 0.6);
				font-size: 0.78rem;
				text-decoration: none;
			}
			.forgot-link a:hover {
				color: var(--gold);
			}

			.status {
				margin-top: 1rem;
				padding: 0.5rem 0.6rem;
				border-radius: 6px;
				font-size: 0.82rem;
				background: rgba(255, 255, 255, 0.08);
				color: rgba(255, 255, 255, 0.85);
			}
			.status.error {
				background: rgba(231, 76, 60, 0.18);
				color: #ff9b9b;
			}
			.status.success {
				background: rgba(39, 174, 96, 0.18);
				color: #9be5b8;
			}

			.state-msg.error {
				color: #ff9b9b;
				padding: 0.4rem 0;
				font-size: 0.82rem;
			}

			.hidden {
				display: none !important;
			}

			@media (max-width: 720px) {
				.landing {
					flex-direction: column;
				}
				.landing-map {
					flex: 0 0 42vh;
				}
				.landing-auth {
					flex: 1;
					max-width: none;
					padding: 1.5rem 1.25rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="landing">
			<section class="landing-map">
				<div class="map-banner">
					<h1>
						<span class="gold">A</span>
						damas
						<span class="gold">→</span>
						<span class="gold">A</span>
						urum
					</h1>
					<p>
						A location-based campus trivia &
						card game. Sign in to take on
						live challenges.
					</p>
				</div>
				<div id="map"></div>
			</section>

			<aside class="landing-auth">
				<div class="auth-logo">
					<span class="a">A</span>
					<span class="sep">→</span>
					<span class="a">A</span>
				</div>
				<p class="auth-subtitle">Adamas to Aurum</p>

				<div class="auth-tabs">
					<button
						type="button"
						class="auth-tab active"
						id="tab-signin"
					>
						Sign in
					</button>
					<button
						type="button"
						class="auth-tab"
						id="tab-signup"
					>
						Sign up
					</button>
				</div>

				<!-- ===================== LOG IN ===================== -->
				<form id="login-form" novalidate onsubmit="handleEmailLogin(event)">
					<button
						type="button"
						class="btn-google"
						onclick="handleGoogleLogin()"
					>
						<svg viewBox="0 0 24 24">
							<path
								d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
								fill="#4285F4"
							/>
							<path
								d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
								fill="#34A853"
							/>
							<path
								d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
								fill="#FBBC05"
							/>
							<path
								d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
								fill="#EA4335"
							/>
						</svg>
						Log in with Google
					</button>

					<div class="or-divider">
						<span>or</span>
					</div>

					<div class="field">
						<label for="login-email">
							Email
							<span class="req">
								*
							</span>
						</label>
						<input
							id="login-email"
							type="email"
							placeholder="your@email.com"
							required
							autocomplete="email"
						/>
					</div>
					<div
						class="field"
						style="margin-bottom: 1.5rem"
					>
						<label for="login-password">
							Password
							<span class="req">
								*
							</span>
						</label>
						<input
							id="login-password"
							type="password"
							placeholder="Password"
							required
							autocomplete="current-password"
						/>
					</div>
					<button
						type="submit"
						class="btn-gold"
						id="btn-login"
					>
						Log in
					</button>
					<p class="forgot-link">
						<a
							href="#"
							onclick="
								handleForgotPassword(
									event
								)
							"
						>
							Forgot password?
						</a>
					</p>
				</form>

				<!-- ===================== SIGN UP ===================== -->
				<form
					id="signup-form"
					class="hidden"
					novalidate
					onsubmit="handleEmailSignUp(event)"
				>
					<button
						type="button"
						class="btn-google"
						onclick="handleGoogleSignUp()"
					>
						<svg viewBox="0 0 24 24">
							<path
								d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
								fill="#4285F4"
							/>
							<path
								d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
								fill="#34A853"
							/>
							<path
								d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
								fill="#FBBC05"
							/>
							<path
								d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
								fill="#EA4335"
							/>
						</svg>
						Sign up with Google
					</button>

					<div class="or-divider">
						<span>or</span>
					</div>

					<div class="field">
						<label for="signup-name">
							Name
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signup-name"
							type="text"
							placeholder="Display name"
							required
							autocomplete="name"
						/>
					</div>
					<div class="field">
						<label for="signup-email">
							Email
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signup-email"
							type="email"
							placeholder="your@email.com"
							required
							autocomplete="email"
						/>
					</div>
					<div
						class="field"
						style="margin-bottom: 1.5rem"
					>
						<label for="signup-password">
							Password (min 8)
							<span class="req">
								*
							</span>
						</label>
						<input
							id="signup-password"
							type="password"
							placeholder="Password"
							required
							minlength="8"
							autocomplete="new-password"
						/>
					</div>
					<button
						type="submit"
						class="btn-gold"
						id="btn-signup"
					>
						Create account
					</button>
				</form>

				<div id="status" class="status hidden"></div>
			</aside>
		</div>

		<div id="toast" class="toast" aria-live="polite"></div>

		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<script type="module" src="/js/auth-client.bundle.mjs"></script>
		<script type="module" src="/js/main.js"></script>
		<script type="module" src="/js/auth.js"></script>
	</body>
</html>
