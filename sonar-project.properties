# SonarQube placeholder — safe to keep even without a SonarQube server
# When SonarQube is introduced, point sonar.host.url and sonar.login to it
# and run: npx sonar-scanner  (or via Gitea Actions with sonarsource/sonar-scanner-cli)

sonar.projectKey=Adamas2Aurum
sonar.projectName=Adamas2Aurum
sonar.projectVersion=1.0
sonar.sources=app/src
sonar.exclusions=**/*.test.js,**/node_modules/**,**/coverage/**,**/badges/**,**/*.geojson
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=**/*.test.js,**/node_modules/**
# sonar.host.url=http://sonarqube.local:9000
# sonar.login=your_token_here
